<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdullah | Gotham</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    /* خلفية باتمان متحركة */
    background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url("https://i.imgur.com/6b1eKQy.gif")
        center / cover fixed no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}

/* تأثير ضباب متحرك */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255, 220, 0, 0.12),
            transparent 35%
        );

    animation: fog 8s ease-in-out infinite alternate;
}

@keyframes fog {
    from {
        transform: scale(1);
        opacity: 0.5;
    }

    to {
        transform: scale(1.15);
        opacity: 1;
    }
}

.container {
    width: 90%;
    max-width: 430px;
    text-align: center;
    padding: 30px 0;
}

/* شعار باتمان */
.batman {
    font-size: 75px;
    margin-bottom: 15px;

    filter: drop-shadow(0 0 15px #ffd900);

    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

/* الاسم */
h1 {
    font-size: 42px;
    color: #ffd900;
    letter-spacing: 2px;
    margin-bottom: 8px;

    text-shadow:
        0 0 10px rgba(255,217,0,0.7);
}

p {
    color: #ddd;
    font-size: 16px;
    margin-bottom: 30px;
}

/* الأزرار */
.button {
    display: block;
    width: 100%;

    padding: 18px;
    margin: 14px 0;

    border: 2px solid #ffd900;
    border-radius: 18px;

    background: rgba(10,10,10,0.65);

    color: white;
    text-decoration: none;

    font-size: 20px;
    font-weight: bold;

    backdrop-filter: blur(8px);

    transition: 0.3s;
}

/* حركة عند لمس الزر */
.button:hover {
    background: #ffd900;
    color: black;

    transform: scale(1.03);

    box-shadow:
        0 0 20px rgba(255,217,0,0.7);
}

.button:active {
    transform: scale(0.97);
}

/* شعار صغير */
.bat-symbol {
    color: #ffd900;
    font-size: 45px;

    margin-bottom: 5px;

    text-shadow:
        0 0 20px #ffd900;
}

/* للجوال */
@media (max-width: 500px) {

    .container {
        width: 88%;
    }

    h1 {
        font-size: 38px;
    }

    .button {
        padding: 16px;
        font-size: 18px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="batman">🦇</div>

    <div class="bat-symbol">🦇</div>

    <h1>ABDULLAH</h1>

    <p>Welcome to my Gotham</p>

    <a class="button"
       href="https://github.com/">
       🐙 GitHub
    </a>

    <a class="button"
       href="https://instagram.com/">
       📷 Instagram
    </a>

    <a class="button"
       href="https://tiktok.com/">
       🎵 TikTok
    </a>

    <a class="button"
       href="https://telegram.org/">
       ✈️ Telegram
    </a>

</div>

</body>
</html>
