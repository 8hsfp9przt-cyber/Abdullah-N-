<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdullah | Gotham</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
overflow-x: hidden;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 420px;
    text-align: center;
}

.batman {
    font-size: 90px;
    filter: drop-shadow(0 0 15px #ffd900);
    animation: float 2s infinite ease-in-out;
}

h1 {
    color: #ffd900;
    font-size: 36px;
    margin: 10px 0;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

a {
    display: block;
    padding: 16px;
    margin: 14px 0;
    border: 2px solid #ffd900;
    border-radius: 12px;
    color: white;
    text-decoration: none;
    background: #111;
    font-weight: bold;
    transition: 0.3s;
}

a:hover {
    background: #ffd900;
    color: black;
    transform: scale(1.05);
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="batman">🦇</div>

    <h1>ABDULLAH</h1>

    <div class="subtitle">
        Welcome to my Gotham
    </div>

    <a href="https://github.com/" target="_blank">
        GitHub
    </a>

    <a href="https://instagram.com/" target="_blank">
        Instagram
    </a>

    <a href="https://tiktok.com/" target="_blank">
        TikTok
    </a>

    <a href="https://t.me/" target="_blank">
        Telegram
    </a>

</div>

</body>
</html>
