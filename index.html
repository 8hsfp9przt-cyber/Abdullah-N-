<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdullah | Gotham</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;

    /* BATMAN BACKGROUND */
    background-image:
        linear-gradient(
            rgba(0, 0, 20, 0.45),
            rgba(0, 0, 0, 0.75)
        ),
        url("batman.png");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    animation: backgroundMove 12s ease-in-out infinite alternate;
}


/* حركة الخلفية */
@keyframes backgroundMove {

    0% {
        background-position: center center;
        background-size: 100% auto;
    }

    100% {
        background-position: center top;
        background-size: 110% auto;
    }
}


/* طبقة غامقة فوق الخلفية */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 15%,
            rgba(0,0,0,0.55) 100%
        );

    pointer-events: none;
    z-index: 0;
}


/* المحتوى */
.container {
    position: relative;
    z-index: 1;

    width: 90%;
    max-width: 500px;

    margin: auto;
    padding: 60px 0 50px;

    text-align: center;
}


/* شعار باتمان */
.batman-logo {
    width: 150px;
    height: 150px;

    object-fit: contain;

    margin-bottom: 20px;

    filter:
        drop-shadow(0 0 15px #ffd900)
        drop-shadow(0 0 35px rgba(255,215,0,0.6));

    animation: batmanFloat 3s ease-in-out infinite;
}


@keyframes batmanFloat {

    0%, 100% {
        transform: translateY(0) scale(1);
    }

    50% {
        transform: translateY(-12px) scale(1.04);
    }
}


/* الاسم */
h1 {
    font-size: 55px;
    font-weight: 900;

    color: #ffd900;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px #ffd900,
        0 0 25px rgba(255,215,0,0.5);

    margin-bottom: 10px;
}


/* الوصف */
.subtitle {
    font-size: 20px;
    color: #eeeeee;

    margin-bottom: 35px;

    text-shadow:
        0 2px 8px black;
}


/* الأزرار */
.buttons {
    display: flex;
    flex-direction: column;
    gap: 18px;
}


/* شكل الزر */
.btn {
    display: block;

    width: 100%;

    padding: 20px;

    border: 2px solid #ffd900;
    border-radius: 18px;

    background: rgba(10,10,10,0.65);

    backdrop-filter: blur(8px);

    color: white;

    text-decoration: none;

    font-size: 22px;
    font-weight: bold;

    transition:
        transform 0.25s,
        background 0.25s,
        box-shadow 0.25s;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.4);
}


/* عند الضغط / اللمس */
.btn:hover {
    transform: scale(1.04);

    background: #ffd900;

    color: #050505;

    box-shadow:
        0 0 20px #ffd900,
        0 0 45px rgba(255,215,0,0.5);
}


/* أيقونة بسيطة */
.icon {
    margin-right: 8px;
}


/* الحقوق */
.footer {
    margin-top: 45px;

    color: rgba(255,255,255,0.7);

    font-size: 14px;
}


/* للموبايل */
@media (max-width: 600px) {

    .container {
        padding-top: 45px;
    }

    .batman-logo {
        width: 130px;
        height: 130px;
    }

    h1 {
        font-size: 42px;
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: 18px;
    }

    .btn {
        padding: 18px;
        font-size: 20px;
    }
}

</style>
</head>


<body>

<div class="container">

    <!-- صورة باتمان -->
    <img
        class="batman-logo"
        src="batman.gif"
        alt="Batman"
    >

    <!-- الاسم -->
    <h1>ABDULLAH</h1>

    <p class="subtitle">
        Welcome to my Gotham 🦇
    </p>


    <!-- الأزرار -->
    <div class="buttons">

        <a
            class="btn"
            href="https://github.com/8hsfp9przt-cyber"
            target="_blank"
        >
            🦇 GitHub
        </a>


        <a
            class="btn"
            href="#"
            target="_blank"
        >
            📸 Instagram
        </a>


        <a
            class="btn"
            href="#"
            target="_blank"
        >
            🎵 TikTok
        </a>


        <a
            class="btn"
            href="#"
            target="_blank"
        >
            ✈️ Telegram
        </a>

    </div>


    <div class="footer">
        © 2026 Abdullah • Gotham
    </div>

</div>

</body>
</html>
